<HTML>
<Title>TopPage</Title>
<h1>次に進むには<font color=red>P</font><font color=green>A</font><font color=yellow>S</font><font color=blue>S</font>を入力すること</h1>

<input type="text" id="code">

<button onclick="checkCode()">
  送信
</button>

<p id="message"></p>

<script>
function checkCode() {
  const code =
    document.getElementById("code").value;

  if (code === "9742") {
    document.getElementById("message").innerText =
      "正解！";
  } else {
    document.getElementById("message").innerText =
      "不正解";
  }
}
</script>
</HTML>
